<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070A10" />
    </linearGradient>

    <linearGradient id="accentGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <linearGradient id="accentGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.08); opacity: 1; }
    }
    @keyframes float1 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(2deg); }
    }
    @keyframes float2 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(8px) rotate(-2deg); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }
    .node-pulse {
      animation: pulse 4s ease-in-out infinite;
      transform-origin: center;
    }
    .floating-card-1 {
      animation: float1 6s ease-in-out infinite;
      transform-origin: center;
    }
    .floating-card-2 {
      animation: float2 7s ease-in-out infinite;
      transform-origin: center;
    }
    .network-line {
      stroke-dasharray: 6, 6;
      animation: dash 3s linear infinite;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
    }
    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.03em;
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
    }
  </style>

  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="none" stroke="#334155" stroke-width="1.5" />

  <circle cx="200" cy="180" r="140" fill="#6366F1" opacity="0.15" filter="url(#glow)"/>
  <circle cx="1020" cy="180" r="150" fill="#EC4899" opacity="0.12" filter="url(#glow)"/>
  <circle cx="600" cy="300" r="120" fill="#38BDF8" opacity="0.1" filter="url(#glow)"/>

  <g id="ecosystem-network" transform="translate(60, 40)">
    <path class="network-line" d="M 120 140 L 40 60" stroke="#818CF8" stroke-width="2" opacity="0.6"/>
    <path class="network-line" d="M 120 140 L 200 50" stroke="#C084FC" stroke-width="2" opacity="0.6"/>
    <path class="network-line" d="M 120 140 L 220 210" stroke="#F472B6" stroke-width="2" opacity="0.6"/>
    <path class="network-line" d="M 120 140 L 40 220" stroke="#38BDF8" stroke-width="2" opacity="0.6"/>
    <path class="network-line" d="M 200 50 L 220 210" stroke="#64748B" stroke-width="1.5" opacity="0.4"/>

    <g class="floating-card-1" transform="translate(40, 60)">
      <circle r="28" fill="#1E293B" stroke="#6366F1" stroke-width="2" filter="url(#shadow)"/>
      <text x="0" y="5" font-size="20" text-anchor="middle">🤝</text>
      <rect x="-35" y="34" width="70" height="18" rx="9" fill="#1E1B4B" stroke="#6366F1" stroke-width="1"/>
      <text class="badge-text" x="0" y="47" fill="#A5B4FC" font-size="10" text-anchor="middle">PRM &amp; Portal</text>
    </g>

    <g class="floating-card-2" transform="translate(200, 50)">
      <circle r="26" fill="#1E293B" stroke="#8B5CF6" stroke-width="2" filter="url(#shadow)"/>
      <text x="0" y="5" font-size="18" text-anchor="middle">⚡</text>
      <rect x="-32" y="32" width="64" height="18" rx="9" fill="#2E1065" stroke="#8B5CF6" stroke-width="1"/>
      <text class="badge-text" x="0" y="45" fill="#DDD6FE" font-size="10" text-anchor="middle">Co-Selling</text>
    </g>

    <g class="floating-card-1" transform="translate(220, 210)">
      <circle r="27" fill="#1E293B" stroke="#EC4899" stroke-width="2" filter="url(#shadow)"/>
      <text x="0" y="5" font-size="18" text-anchor="middle">📈</text>
      <rect x="-35" y="33" width="70" height="18" rx="9" fill="#500724" stroke="#EC4899" stroke-width="1"/>
      <text class="badge-text" x="0" y="46" fill="#FBCFE8" font-size="10" text-anchor="middle">Attribution</text>
    </g>

    <g class="floating-card-2" transform="translate(40, 220)">
      <circle r="26" fill="#1E293B" stroke="#38BDF8" stroke-width="2" filter="url(#shadow)"/>
      <text x="0" y="5" font-size="18" text-anchor="middle">🗺️</text>
      <rect x="-42" y="32" width="84" height="18" rx="9" fill="#082F49" stroke="#38BDF8" stroke-width="1"/>
      <text class="badge-text" x="0" y="45" fill="#BAE6FD" font-size="10" text-anchor="middle">Account Map</text>
    </g>

    <g class="node-pulse" transform="translate(120, 140)">
      <circle r="42" fill="url(#accentGrad1)" opacity="0.3" filter="url(#cardGlow)"/>
      <circle r="36" fill="#0F172A" stroke="url(#accentGrad1)" stroke-width="3" filter="url(#shadow)"/>
      <text x="0" y="8" font-size="28" text-anchor="middle">🌐</text>
    </g>
  </g>

  <g transform="translate(370, 70)">
    <g transform="translate(0, 0)">
      <rect width="300" height="28" rx="14" fill="#1E293B" stroke="#4F46E5" stroke-width="1.2" />
      <circle cx="14" cy="14" r="5" fill="#10B981">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text class="badge-text" x="28" y="18" fill="#E2E8F0" font-size="11.5">🚀 CURATED DIRECTORY &amp; ARCHITECTURE</text>
    </g>

    <text class="title-text" x="0" y="72" font-size="38" fill="#FFFFFF">
      Awesome Partner Ecosystem
    </text>
    <text class="title-text" x="0" y="112" font-size="38" fill="url(#accentGrad2)">
      Platforms &amp; Open Source
    </text>

    <text class="subtitle-text" x="0" y="148" font-size="15" fill="#94A3B8">
      The definitive index of PRM, Channel Portals, Account Mapping, Co-Selling,
    </text>
    <text class="subtitle-text" x="0" y="170" font-size="15" fill="#94A3B8">
      Partner Enablement &amp; Composable Open-Source Ecosystem Stacks.
    </text>

    <g transform="translate(0, 202)">
      <rect x="0" y="0" width="165" height="34" rx="8" fill="#1E293B" stroke="#334155" />
      <text x="12" y="22" font-size="15">🏢</text>
      <text class="badge-text" x="35" y="21" fill="#F1F5F9" font-size="12">SaaS &amp; Enterprise</text>

      <rect x="180" y="0" width="165" height="34" rx="8" fill="#1E293B" stroke="#334155" />
      <text x="192" y="22" font-size="15">💻</text>
      <text class="badge-text" x="215" y="21" fill="#F1F5F9" font-size="12">Open-Source PRM</text>

      <rect x="360" y="0" width="180" height="34" rx="8" fill="#1E293B" stroke="#334155" />
      <text x="372" y="22" font-size="15">📊</text>
      <text class="badge-text" x="395" y="21" fill="#F1F5F9" font-size="12">Pricing &amp; Valuations</text>

      <rect x="555" y="0" width="155" height="34" rx="8" fill="#1E293B" stroke="#334155" />
      <text x="567" y="22" font-size="15">⭐</text>
      <text class="badge-text" x="590" y="21" fill="#F1F5F9" font-size="12">Ranked by Stars</text>
    </g>
  </g>
</svg>
